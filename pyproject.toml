[project]
name = "epcot-fw"
version = "0.1.0"
description = "Epcot International Food & Wine Festival data crawler, database, and API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "protego>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-postgresql>=6.1",
    "respx>=0.21",
    "ruff>=0.5",
]
data_ledger = [
    "pillow>=10.0",
]

[project.scripts]
epcot-fw = "epcot_fw.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epcot_fw"]

[tool.ruff]
line-length = 100
target-version = "py312"
